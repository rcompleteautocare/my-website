name: CI

on:
  pull_request:

jobs:
  build:
    name: Lint, Build, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Runs after the build so the generated Prisma client and Next.js route
      # types exist. The build needs no secrets: every integration fails safe
      # when its variables are unset.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Sitemap coverage
        run: python3 scripts/check-sitemap-coverage.py
